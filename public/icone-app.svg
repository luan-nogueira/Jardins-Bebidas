<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícone do app (tela inicial): os dois canecos brindando do logo. -->
  <defs>
    <radialGradient id="fundo" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#7a4526"/>
      <stop offset="1" stop-color="#3a1a0a"/>
    </radialGradient>
    <g id="caneco">
      <path d="M 16,-12 q 14,0 14,14 q 0,14 -14,14" fill="none" stroke="#1C0C04" stroke-width="5" stroke-linecap="round"/>
      <rect x="-18" y="-20" width="34" height="44" rx="5" fill="#F6A623" stroke="#1C0C04" stroke-width="4"/>
      <path d="M -9,-12 L -9,16" stroke="#FFD27A" stroke-width="3" stroke-linecap="round"/>
      <path d="M 2,-12 L 2,16" stroke="#E08A12" stroke-width="3" stroke-linecap="round"/>
      <path d="M -21,-18 q -3,-12 9,-13 q 4,-9 14,-5 q 9,-6 15,3 q 9,1 6,15 Z" fill="#FFF8EC" stroke="#1C0C04" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#fundo)"/>
  <circle cx="256" cy="262" r="150" fill="#F26A1B" opacity="0.18"/>
  <g transform="translate(256 268) scale(3.1)">
    <g transform="translate(-30 0) rotate(-14)"><use href="#caneco"/></g>
    <g transform="translate(30 0) rotate(14) scale(-1 1)"><use href="#caneco"/></g>
  </g>
</svg>
